[package]
name = "archeasy"
version = "0.1.2"
edition = "2024"
description = "A beginner-friendly Arch Linux software browser"
license = "MIT"
repository = "https://github.com/danny19862025/ArchEasy"
readme = "README.md"

[dependencies]
adw = { version = "0.8", package = "libadwaita", features = ["v1_2"] }
gtk = { package = "gtk4", version = "=0.10.3", features = ["v4_10"] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
